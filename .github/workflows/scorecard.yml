name: OpenSSF Scorecard

on:
  push:
    branches: [ master ]
  schedule:
    - cron: "41 2 * * 6" # weekly, Saturday 02:41 UTC
  branch_protection_rule:
  workflow_dispatch:

# Read-only at the top; the job asks for exactly what it needs.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish results to the OpenSSF API (README badge)
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # publish_results sends this public repository's results to the OpenSSF API, which is
      # what the README badge reads. Set it to false (and drop id-token: write) to keep them
      # in this repository's code-scanning alerts only.
      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
