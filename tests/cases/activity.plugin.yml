- name: 📰 Recent activity - Recent activity
  uses: lowlighter/metrics@latest
  with:
    token: MOCKED_TOKEN
    plugin_activity: 'yes'
    plugin_activity_limit: 20
    plugin_activity_days: 0
    plugin_activity_filter: issue, pr, release, fork, review, ref/create, push
    use_mocked_data: 'yes'
    verify: 'yes'
